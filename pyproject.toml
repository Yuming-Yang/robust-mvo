[project]
name = "robust-mvo"
version = "0.1.0"
description = "A small mean-variance optimizer for long-short books with covariance stabilization and an explicit, tested degradation chain."
readme = "README.md"
authors = [{ name = "Yang Yuming" }]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbmake>=1.5.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scikit-learn>=1.9",
]
